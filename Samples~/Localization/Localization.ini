[localization]
; 本文件是多语言导出唯一可编辑配置，路径均相对于本文件所在目录。init 会填写项目与输出路径。
source=.
unity_project=
languages=ChineseSimplified,English,Japanese
default_locale=ChineseSimplified
accessor_mode=resolved
; 指向本项目实际使用的 Luban.dll，包不内置工具。
luban_dll=
; 不需要检查普通表的 text 引用时可留空。
ordinary_schema=
base_data_out=
base_code_out=
; 单层项目的数据必须在 Resources 中；常量访问器生成 LocalizationKey.cs。
patch_data_out=
patch_code_out=
